name: Zero-Trust Security CI

on: [push, pull_request]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Cryptographic & Ledger Tests
        run: |
          python -m unittest discover -s tests
